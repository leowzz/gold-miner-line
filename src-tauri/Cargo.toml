[package]
name = "goldline"
version = "0.1.0"
description = "Gold Miner alignment overlay"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3"
xcap = "0.9.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
