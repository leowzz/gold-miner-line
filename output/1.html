<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黄金矿工辅助线预览</title>
<style>
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 24px;
    background: #16191d; color: #e9edf1;
    font: 14px/1.5 system-ui, sans-serif;
  }
  main { max-width: 1100px; margin: auto }
  header, .controls {
    display: flex; flex-wrap: wrap;
    align-items: center; gap: 16px; margin-bottom: 16px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 auto 0 0 }
  label { display: grid; gap: 5px }
  input[type=range] { width: 150px; accent-color: #59e5ee }
  button, .upload {
    border: 1px solid #454b54; border-radius: 7px;
    padding: 8px 12px; background: #252a31;
    color: inherit; font: inherit; cursor: pointer;
  }
  .upload input { display: none }
  .stage {
    position: relative; overflow: hidden;
    border-radius: 8px; background: #805234;
    aspect-ratio: 1700 / 1184;
  }
  .stage img { display: block; width: 100%; height: 100% }
  svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    touch-action: none;
  }
  #origin { cursor: grab }
  #origin:active { cursor: grabbing }
  footer { margin-top: 10px; color: #aab2bd }
</style>

<main>
  <header>
    <h1>黄金矿工 · 辅助线预览</h1>
    <label class="upload">
      选择游戏截图
      <input id="file" type="file" accept="image/*">
    </label>
    <button id="toggle" aria-pressed="true">隐藏辅助线</button>
  </header>

  <div class="controls">
    <label>线数 <output id="countValue">9</output>
      <input id="count" type="range" min="1" max="31" step="2" value="9">
    </label>
    <label>展开角度 <output id="spreadValue">150°</output>
      <input id="spread" type="range" min="0" max="180" value="150">
    </label>
    <label>方向偏转 <output id="angleValue">0°</output>
      <input id="angle" type="range" min="-90" max="90" value="0">
    </label>
    <label>透明度 <output id="opacityValue">65%</output>
      <input id="opacity" type="range" min="10" max="100" value="65">
    </label>
    <label>颜色
      <input id="color" type="color" value="#59e5ee">
    </label>
  </div>

  <div class="stage" id="stage">
    <img id="background" alt="请选择游戏截图作为预览背景" hidden>
    <svg id="canvas" viewBox="0 0 1700 1184"
         role="img" aria-label="可拖动圆心的扇形辅助线预览">
      <g id="overlay">
        <g id="lines"></g>
        <g id="origin">
          <circle r="28" fill="transparent"/>
          <circle r="10" fill="#15252b" stroke="#59e5ee" stroke-width="2"/>
          <path d="M-17 0H17M0-17V17" stroke="#59e5ee" stroke-width="2"/>
        </g>
      </g>
    </svg>
  </div>
  <footer>拖动圆心对齐钩爪悬挂轴心。截图仅在本页读取，不会上传。</footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $("canvas");
  const ns = "http://www.w3.org/2000/svg";
  let width = 1700, height = 1184;
  let x = 852, y = 213, dragging = false, visible = true;
  let imageUrl;

  function draw() {
    const count = +$("count").value;
    const spread = +$("spread").value;
    const angle = +$("angle").value;
    const color = $("color").value;
    const length = Math.hypot(width, height);

    $("countValue").value = count;
    $("spreadValue").value = spread + "°";
    $("angleValue").value = angle + "°";
    $("opacityValue").value = $("opacity").value + "%";
    $("lines").replaceChildren();
    $("lines").setAttribute("opacity", +$("opacity").value / 100);

    for (let i = 0; i < count; i++) {
      const offset = count === 1 ? 0 : (i / (count - 1) - .5) * spread;
      const radians = (angle + offset) * Math.PI / 180;
      const line = document.createElementNS(ns, "line");
      Object.entries({
        x1: x, y1: y,
        x2: x + Math.sin(radians) * length,
        y2: y + Math.cos(radians) * length,
        stroke: color,
        "stroke-width": i === (count - 1) / 2 ? 2.2 : 1.3,
        "vector-effect": "non-scaling-stroke"
      }).forEach(([key, value]) => line.setAttribute(key, value));
      $("lines").append(line);
    }
    $("origin").setAttribute("transform", `translate(${x} ${y})`);
    $("origin").querySelectorAll("[stroke]").forEach(
      element => element.setAttribute("stroke", color)
    );
  }

  ["count", "spread", "angle", "opacity", "color"].forEach(
    id => $(id).addEventListener("input", draw)
  );

  $("origin").addEventListener("pointerdown", event => {
    dragging = true;
    svg.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  svg.addEventListener("pointermove", event => {
    if (!dragging) return;
    const point = new DOMPoint(event.clientX, event.clientY)
      .matrixTransform(svg.getScreenCTM().inverse());
    x = Math.max(0, Math.min(width, point.x));
    y = Math.max(0, Math.min(height, point.y));
    draw();
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(
    name => svg.addEventListener(name, () => dragging = false)
  );

  $("toggle").onclick = () => {
    visible = !visible;
    $("overlay").style.display = visible ? "" : "none";
    $("toggle").textContent = visible ? "隐藏辅助线" : "显示辅助线";
    $("toggle").setAttribute("aria-pressed", String(visible));
  };

  $("file").onchange = event => {
    const file = event.target.files[0];
    if (!file) return;
    if (imageUrl) URL.revokeObjectURL(imageUrl);
    imageUrl = URL.createObjectURL(file);
    const img = $("background");
    img.onload = () => {
      width = img.naturalWidth;
      height = img.naturalHeight;
      x = width * (852 / 1700);
      y = height * (213 / 1184);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      $("stage").style.aspectRatio = `${width} / ${height}`;
      img.hidden = false;
      draw();
    };
    img.src = imageUrl;
  };
  draw();
})();
</script>
</html>
